<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#9333ea"/>
  <!-- Neural node / cell body -->
  <circle cx="16" cy="11" r="5.5" fill="white"/>
  <!-- Inner highlight on node -->
  <circle cx="14.5" cy="9.5" r="1.75" fill="rgba(255,255,255,0.4)"/>
  <!-- "11" bars — encode the a11y numeral and act as dendrites/axons -->
  <rect x="10" y="18.5" width="4" height="9" rx="2" fill="#f97316"/>
  <rect x="18" y="18.5" width="4" height="9" rx="2" fill="#f97316"/>
  <!-- Thin connector lines from node to bars -->
  <line x1="12" y1="16.5" x2="12" y2="18.5" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="16.5" x2="20" y2="18.5" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
</svg>
